<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Interface de Comando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            color: #00f0ff;
        }

        .jarvis-font {
            font-family: 'Orbitron', sans-serif;
        }

        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }

        .glow-border {
            border: 1px solid rgba(0, 240, 255, 0.4);
        }

        .arc-reactor {
            animation: pulseArc 2.5s infinite ease-in-out;
        }

        @keyframes pulseArc {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0,240,255,0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(0,240,255,0.95)); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #081226; }
        ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }

        audio::-webkit-media-controls-panel {
            background-color: #082f49;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #00f0ff;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header / HUD status -->
    <header class="flex justify-between items-center border-b border-cyan-500/30 pb-4">
        <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-full border-2 border-cyan-400 flex items-center justify-center arc-reactor bg-cyan-950/40">
                <i class="fa-solid fa-atom text-cyan-400 text-2xl"></i>
            </div>
            <div>
                <h1 class="jarvis-font text-2xl font-extrabold tracking-widest text-cyan-300">J.A.R.V.I.S.</h1>
                <p class="text-xs text-cyan-400/70 tracking-wider">SISTEMA INTELIGENTE DE COMANDO</p>
            </div>
        </div>
        <div class="flex items-center space-x-6 text-sm font-semibold">
            <!-- HUD Clock Widget -->
            <div class="flex items-center space-x-2 border-r border-cyan-500/30 pr-4">
                <i class="fa-regular fa-clock text-cyan-400 text-sm animate-pulse"></i>
                <span id="hud-clock" class="jarvis-font text-cyan-300 font-bold text-sm tracking-wider">--:--:--</span>
            </div>

            <button id="wake-toggle" type="button" class="px-3 py-1.5 rounded-lg border border-cyan-500/50 bg-cyan-950/60 hover:bg-cyan-900 text-cyan-300 text-xs flex items-center space-x-2 transition-all cursor-pointer">
                <span class="w-2 h-2 rounded-full bg-slate-500" id="wake-dot"></span>
                <span id="wake-text">Modo Viva-Voz ("JARVIS")</span>
            </button>

            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-emerald-400">ONLINE</span>
            </div>
            <div class="hidden sm:block text-cyan-400/80" id="model-badge">MODELO: QWEN 2.5 (GPU 7B / LOCAL AUTO)</div>
        </div>
    </header>

    <!-- Chat Console -->
    <main id="chat-box" class="flex-1 overflow-y-auto my-4 space-y-4 pr-2">
        <!-- Default Welcome Message -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-cyan-900/60 border border-cyan-400 flex items-center justify-center text-xs font-bold">J</div>
            <div class="max-w-2xl bg-cyan-950/40 border border-cyan-500/30 p-3.5 rounded-2xl rounded-tl-none text-cyan-100 text-base leading-relaxed">
                Em que posso ser útil hoje, Senhor?
            </div>
        </div>
    </main>

    <!-- Input Bar & Voice Trigger -->
    <footer class="mt-2">
        <form id="chat-form" class="flex items-center space-x-3 bg-slate-900/80 p-2 rounded-2xl glow-border">
            <button type="button" id="mic-btn" title="Falar pelo Microfone"
                    class="w-12 h-12 rounded-xl bg-cyan-950 hover:bg-cyan-900 border border-cyan-400/50 flex items-center justify-center text-cyan-300 transition-all duration-200">
                <i class="fa-solid fa-microphone text-lg" id="mic-icon"></i>
            </button>

            <input type="text" id="user-input" autocomplete="off" placeholder="Digite ou diga 'Jarvis <comando>'..."
                   class="flex-1 bg-transparent px-4 py-3 text-cyan-100 placeholder-cyan-500/60 focus:outline-none text-lg">

            <button type="submit" id="send-btn"
                    class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold jarvis-font rounded-xl transition-all shadow-lg glow-cyan flex items-center space-x-2">
                <span>ENVIAR</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const wakeToggle = document.getElementById('wake-toggle');
        const wakeDot = document.getElementById('wake-dot');
        const wakeText = document.getElementById('wake-text');
        const hudClock = document.getElementById('hud-clock');

        let isWakeMode = false;
        let continuousRecognition = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let currentAudioUrl = null;
        let isRecording = false;
        let activeStream = null;

        // Atualização em Tempo Real do Relógio Digital na HUD Web
        function updateHUDClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('pt-BR');
            const dateStr = now.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
            hudClock.innerText = `${dateStr.toUpperCase()} ${timeStr}`;
        }
        setInterval(updateHUDClock, 1000);
        updateHUDClock();

        function appendMessage(sender, text, isUser = false, source = null, audioUrl = null) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${
                isUser ? 'bg-cyan-600 text-slate-950 font-extrabold' : 'bg-cyan-900/60 border border-cyan-400 text-cyan-300'
            }`;
            avatar.innerText = isUser ? 'SR' : 'J';

            const bubble = document.createElement('div');
            bubble.className = `max-w-2xl p-3.5 rounded-2xl text-base leading-relaxed ${
                isUser
                    ? 'bg-cyan-600/20 border border-cyan-400/40 rounded-tr-none text-cyan-100'
                    : 'bg-cyan-950/40 border border-cyan-500/30 rounded-tl-none text-cyan-100'
            }`;

            let html = '';
            if (!isUser && source) {
                html += `<div class="text-[10px] tracking-wider font-semibold text-cyan-400/70 uppercase mb-1">ORIGEM: ${source}</div>`;
            }
            if (audioUrl) {
                html += `<div class="mb-2"><audio controls autoplay class="h-9 w-64 rounded-lg" src="${audioUrl}"></audio></div>`;
            }
            html += `<div>${text}</div>`;
            bubble.innerHTML = html;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Animação Futurista de Processamento (Thinking)
        function showThinkingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.id = 'thinking-indicator';
            wrapper.className = 'flex items-start space-x-3';
            wrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-cyan-900/60 border border-cyan-400 flex items-center justify-center text-xs font-bold shrink-0 arc-reactor">
                    <i class="fa-solid fa-brain text-cyan-300 animate-pulse"></i>
                </div>
                <div class="bg-cyan-950/40 border border-cyan-500/30 p-3.5 rounded-2xl rounded-tl-none text-cyan-300 text-sm flex items-center space-x-3">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="jarvis-font tracking-wider text-xs uppercase animate-pulse">JARVIS Processando e Sintetizando Resposta...</span>
                </div>
            `;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideThinkingIndicator() {
            const el = document.getElementById('thinking-indicator');
            if (el) el.remove();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            const sendAudioUrl = currentAudioUrl;
            currentAudioUrl = null;

            appendMessage('Você', text, true, null, sendAudioUrl);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            showThinkingIndicator();

            // Extended Timeout (120s) com AbortController para requisições de ferramentas (ex: emails)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 120000);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                hideThinkingIndicator();

                const data = await res.json();
                if (data.reply) {
                    if (data.source) {
                        document.getElementById('model-badge').innerText = `MODELO: ${data.source.toUpperCase()}`;
                    }
                    const responseAudioUrl = `/api/audio?t=${Date.now()}`;
                    appendMessage('JARVIS', data.reply, false, data.source, responseAudioUrl);
                } else if (data.error) {
                    appendMessage('JARVIS', `[Erro]: ${data.error}`);
                }
            } catch (err) {
                clearTimeout(timeoutId);
                hideThinkingIndicator();
                if (err.name === 'AbortError') {
                    appendMessage('JARVIS', '[Erro]: A requisição demorou mais de 2 minutos e expirou.');
                } else {
                    appendMessage('JARVIS', `[Erro de conexão]: ${err.message}`);
                }
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        // ==========================================
        // CAPTURA DE VOZ E MICROFONE NO FRONTEND (MediaRecorder + Backend STT)
        // ==========================================
        micBtn.addEventListener('click', async () => {
            if (isRecording) {
                stopAudioRecording();
            } else {
                await startAudioRecording();
            }
        });

        async function startAudioRecording() {
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(activeStream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    if (activeStream) {
                        activeStream.getTracks().forEach(track => track.stop());
                        activeStream = null;
                    }

                    if (audioChunks.length === 0) return;

                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
                    currentAudioUrl = URL.createObjectURL(audioBlob);

                    await sendAudioToSTT(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;

                // UI Feedback - Gravando
                micBtn.classList.remove('bg-cyan-950', 'border-cyan-400/50', 'text-cyan-300');
                micBtn.classList.add('bg-red-950', 'border-red-500', 'text-red-400', 'animate-pulse');
                micIcon.className = 'fa-solid fa-microphone-slash text-lg';
                userInput.placeholder = "Ouvindo... Clique no mic para enviar sua fala, Senhor...";

            } catch (err) {
                console.error("Erro na captura de áudio:", err);
                alert("Não foi possível acessar o microfone. Verifique as permissões do seu navegador.");
            }
        }

        function stopAudioRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;

            // Restaurar UI
            micBtn.classList.remove('bg-red-950', 'border-red-500', 'text-red-400', 'animate-pulse');
            micBtn.classList.add('bg-cyan-950', 'border-cyan-400/50', 'text-cyan-300');
            micIcon.className = 'fa-solid fa-microphone text-lg';
            userInput.placeholder = "Digite ou diga 'Jarvis <comando>'...";
        }

        async function sendAudioToSTT(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'mic_recording.webm');

            userInput.placeholder = "Transcrevendo voz...";

            try {
                const res = await fetch('/api/audio_stt', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.text && data.text.trim()) {
                    userInput.value = data.text.trim();
                    userInput.placeholder = "Digite ou diga 'Jarvis <comando>'...";
                    // Dispara envio automático
                    setTimeout(() => chatForm.dispatchEvent(new Event('submit')), 100);
                } else {
                    userInput.placeholder = "Nenhuma fala detectada. Tente novamente, Senhor.";
                    setTimeout(() => {
                        userInput.placeholder = "Digite ou diga 'Jarvis <comando>'...";
                    }, 3000);
                }
            } catch (err) {
                console.error("Erro ao enviar áudio STT:", err);
                userInput.placeholder = "Erro ao processar áudio.";
                setTimeout(() => {
                    userInput.placeholder = "Digite ou diga 'Jarvis <comando>'...";
                }, 3000);
            }
        }

        // Web Speech API - Modo Viva-Voz ("JARVIS")
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            continuousRecognition = new SpeechRecognition();
            continuousRecognition.lang = 'pt-BR';
            continuousRecognition.continuous = true;
            continuousRecognition.interimResults = false;

            continuousRecognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        const spoken = event.results[i][0].transcript.trim();
                        const lower = spoken.toLowerCase();

                        if (lower.includes('jarvis')) {
                            let cmd = lower.split('jarvis').pop().trim();
                            if (!cmd) cmd = spoken;
                            userInput.value = cmd;
                            chatForm.dispatchEvent(new Event('submit'));
                        }
                    }
                }
            };

            continuousRecognition.onend = () => {
                if (isWakeMode) {
                    setTimeout(() => {
                        try { continuousRecognition.start(); } catch(e) {}
                    }, 300);
                }
            };

            wakeToggle.addEventListener('click', async () => {
                isWakeMode = !isWakeMode;
                if (isWakeMode) {
                    try {
                        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                            await navigator.mediaDevices.getUserMedia({ audio: true });
                        }
                        continuousRecognition.start();
                        wakeDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
                        wakeToggle.className = 'px-3 py-1.5 rounded-lg border border-emerald-500/80 bg-emerald-950 text-emerald-300 text-xs flex items-center space-x-2 transition-all glow-cyan';
                        wakeText.innerText = 'Viva-Voz Ativo ("JARVIS")';
                    } catch (err) {
                        alert("Por favor, autorize o uso do microfone para ativar o modo viva-voz.");
                        isWakeMode = false;
                    }
                } else {
                    continuousRecognition.stop();
                    wakeDot.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
                    wakeToggle.className = 'px-3 py-1.5 rounded-lg border border-cyan-500/50 bg-cyan-950/60 hover:bg-cyan-900 text-cyan-300 text-xs flex items-center space-x-2 transition-all cursor-pointer';
                    wakeText.innerText = 'Modo Viva-Voz ("JARVIS")';
                }
            });
        } else {
            wakeToggle.style.display = 'none';
        }
    </script>
</body>
</html>
